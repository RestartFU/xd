# A runnable xd for every commit on master. Linux, macOS, and Windows artifacts
# are built from the same commit and published under one rolling nightly tag.
# Every artifact carries its own app, agent, Git, speech, and native runtime.
#
# Built as the nightly profile, which gives it its own application id, settings,
# data directory and workspaces -- so installing it does not disturb a release
# on the same machine, and neither one edits the other's chats.
#
# The headless suite runs first and the release only happens if it passes: a
# nightly that does not work is worse than no nightly.

name: nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

# One at a time, newest wins. Two commits landing together would otherwise race
# to replace the same release, and the loser could be the newer one.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=nightly

      - name: Pack it
        run: |
          set -euo pipefail
          # Named so it unpacks into a directory rather than over the one it
          # was unpacked in, and named for the build so it cannot be mistaken
          # for a release.
          mv dist xd-nightly
          tar -czf xd-nightly-linux-x86_64.tar.gz xd-nightly
          sha256sum xd-nightly-linux-x86_64.tar.gz > xd-nightly-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            xd-nightly-linux-x86_64.tar.gz
            xd-nightly-linux-x86_64.tar.gz.sha256
            scripts/install.sh

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Install native build dependencies
        run: >-
          brew install
          crystal
          pkgconf
          gobject-introspection
          gtk4
          libadwaita
          adwaita-icon-theme
          vte3
          portaudio
          sqlite
          glib-networking
          librsvg
          cmake

      - name: Build the complete macOS app
        run: ./scripts/build-macos.sh "$PWD/macos-dist" nightly

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos-dist/xd-nightly-macos-arm64.zip
            macos-dist/xd-nightly-macos-arm64.zip.sha256
            scripts/install-macos.sh

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-crystal
            mingw-w64-ucrt-x86_64-7zip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-portaudio

      - name: Build the complete Windows payload
        shell: msys2 {0}
        run: ./scripts/build-windows.sh "$PWD/windows-dist" nightly

      - name: Build the MSI
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -Payload windows-dist
          -OutputDirectory windows-artifacts
          -Profile nightly
          -Version 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows-artifacts/xd-nightly-windows-x86_64.msi
            windows-artifacts/xd-nightly-windows-x86_64.msi.sha256
            scripts/install.ps1

  android:
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5

      # A test build, signed with the generated debug key. The runner starts
      # with a cold signing cache, so that key differs per run and Android
      # will refuse to update an installed APK in place -- uninstall first.
      - name: Build the Android APK
        run: ./scripts/mobile-build.sh

      - name: Name it for the release
        run: |
          set -euo pipefail
          mv dist/mobile/xd-mobile-debug.apk xd-nightly-android.apk
          sha256sum xd-nightly-android.apk > xd-nightly-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            xd-nightly-android.apk
            xd-nightly-android.apk.sha256

  publish:
    needs: [linux, macos, windows, android]
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: .
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          subject=$(git log -1 --format=%s)
          notes=$(cat <<EOF
          Built from \`${GITHUB_SHA:0:7}\` — $subject

          Install it:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.sh | sh
          \`\`\`

          Or unpack it yourself:

          \`\`\`
          tar -xzf xd-nightly-linux-x86_64.tar.gz
          ./xd-nightly/xd.sh
          \`\`\`

          macOS Apple Silicon:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install-macos.sh | sh
          \`\`\`

          Windows x86_64:

          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.ps1 | iex
          \`\`\`

          Android:

          Install \`xd-nightly-android.apk\` on a phone that can reach the
          machine running the daemon, then pair it with \`xd serve --pair\`.
          It is a test build signed with a per-build key, so uninstall the
          previous one before installing a newer APK.

          Every artifact is self-contained and installs beside a release.
          On Linux and macOS, the daemon is the same bundled binary and can
          pair another device with \`xd serve --pair\`.
          EOF
          )

          # Replaced rather than edited: the tag has to move to this commit,
          # and a release whose tag points somewhere else is a lie about what
          # is in it.
          gh release delete nightly --cleanup-tag --yes || true

          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$notes" \
            xd-nightly-linux-x86_64.tar.gz \
            xd-nightly-linux-x86_64.tar.gz.sha256 \
            macos-dist/xd-nightly-macos-arm64.zip \
            macos-dist/xd-nightly-macos-arm64.zip.sha256 \
            windows-artifacts/xd-nightly-windows-x86_64.msi \
            windows-artifacts/xd-nightly-windows-x86_64.msi.sha256 \
            xd-nightly-android.apk \
            xd-nightly-android.apk.sha256 \
            scripts/install.sh \
            scripts/install-macos.sh \
            scripts/install.ps1
