# A runnable Rust/GPUI xd for every commit on master, published for Linux and
# both Mac architectures with the independent Android client under one rolling
# nightly tag.
#
# Built as the nightly profile, which gives it its own application id, settings,
# data directory and workspaces -- so installing it does not disturb a release
# on the same machine, and neither one edits the other's chats.
#
# The headless suite runs first and the release only happens if it passes: a
# nightly that does not work is worse than no nightly.

name: nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

# One at a time, newest wins. Two commits landing together would otherwise race
# to replace the same release, and the loser could be the newer one.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=nightly

      - name: Pack it
        run: |
          set -euo pipefail
          # Named so it unpacks into a directory rather than over the one it
          # was unpacked in, and named for the build so it cannot be mistaken
          # for a release.
          mv dist xd-nightly
          tar -czf xd-nightly-linux-x86_64.tar.gz xd-nightly
          sha256sum xd-nightly-linux-x86_64.tar.gz > xd-nightly-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            xd-nightly-linux-x86_64.tar.gz
            xd-nightly-linux-x86_64.tar.gz.sha256

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Limit build parallelism
        run: |
          jobs=$(./scripts/runner-jobs.sh --jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"

      # The dependency compile is most of this job, and a hosted runner keeps
      # nothing between runs. Keyed on the lockfiles, so unchanged dependencies
      # come back already built and cargo works out the rest.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
            daemon-rs/target
            tls-proxy-rs/target
          key: >-
            cargo-${{ runner.os }}-${{ matrix.arch }}-1.95.0-${{
            hashFiles('desktop/Cargo.lock', 'daemon-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.arch }}-1.95.0-

      # whisper.cpp, the agent downloads and WiX are pinned by version, so what
      # lands here is decided by the scripts that put it there.
      - uses: actions/cache@v4
        with:
          path: .build-cache
          key: >-
            payload-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-macos.sh') }}
          restore-keys: payload-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build and smoke-test the native app bundle
        env:
          PROFILE: nightly
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          brew install librsvg
          ./scripts/build-macos.sh
          ./scripts/smoke-macos.sh dist/macos/xd-nightly.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/macos/xd-nightly-macos-${{ matrix.arch }}.zip
            dist/macos/xd-nightly-macos-${{ matrix.arch }}.zip.sha256

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Limit build parallelism
        shell: pwsh
        run: |
          $jobs = [Math]::Max(
            1,
            [Math]::Floor([Environment]::ProcessorCount * 0.75)
          )
          "CARGO_BUILD_JOBS=$jobs" >> $env:GITHUB_ENV
          "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> $env:GITHUB_ENV

      # The dependency compile is most of this job, and a hosted runner keeps
      # nothing between runs. Keyed on the lockfiles, so unchanged dependencies
      # come back already built and cargo works out the rest.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
            daemon-rs/target
            tls-proxy-rs/target
          key: >-
            cargo-${{ runner.os }}-x86_64-1.95.0-${{
            hashFiles('desktop/Cargo.lock', 'daemon-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-x86_64-1.95.0-

      # whisper.cpp, the agent downloads and WiX are pinned by version, so what
      # lands here is decided by the scripts that put it there.
      - uses: actions/cache@v4
        with:
          path: .build-cache
          key: >-
            payload-${{ runner.os }}-x86_64-${{ hashFiles('scripts/build-windows.ps1', 'scripts/package-windows.ps1') }}
          restore-keys: payload-${{ runner.os }}-x86_64-

      - name: Build the self-contained native payload
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: >-
          ./scripts/build-windows.ps1
          -OutputDirectory windows-dist
          -Profile nightly

      - name: Build the Windows downloader and exercise the MSI
        run: |
          ./scripts/package-windows.ps1 `
            -Payload windows-dist `
            -OutputDirectory artifacts `
            -Profile nightly `
            -Version 0.1.0
          ./scripts/install.ps1 `
            -MsiPath artifacts/xd-nightly-windows-x86_64.msi `
            -ChecksumPath artifacts/xd-nightly-windows-x86_64.msi.sha256 `
            -CabPath artifacts/xd1.cab `
            -CabChecksumPath artifacts/xd1.cab.sha256 `
            -Quiet

          # Only what this job built. An artifact is rooted at the deepest
          # directory shared by everything in it, so listing a payload under
          # `artifacts/` beside a file under `scripts/` roots it at the
          # checkout and the payload arrives still nested. The installer
          # scripts come from publish's own checkout instead.
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/xd-nightly-windows-x86_64.msi
            artifacts/xd-nightly-windows-x86_64.msi.sha256
            artifacts/xd1.cab
            artifacts/xd1.cab.sha256
            artifacts/xd-nightly-windows-x86_64-setup.exe
            artifacts/xd-nightly-windows-x86_64-setup.exe.sha256

  android:
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5

      # A test build, signed with the generated debug key. The runner starts
      # with a cold signing cache, so that key differs per run and Android
      # will refuse to update an installed APK in place -- uninstall first.
      - name: Build the Android APK
        run: ./scripts/mobile-build.sh

      - name: Name it for the release
        run: |
          set -euo pipefail
          mv dist/mobile/xd-mobile-debug.apk xd-nightly-android.apk
          sha256sum xd-nightly-android.apk > xd-nightly-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            xd-nightly-android.apk
            xd-nightly-android.apk.sha256

  publish:
    needs: [linux, macos, windows, android]
    # GitHub's own runner, deliberately: this job downloads every artifact and
    # uploads it again as a release asset -- about a gigabyte each way. On a
    # self-hosted runner that gigabyte crosses a home connection twice; here it
    # never leaves GitHub's network.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: .
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          subject=$(git log -1 --format=%s)
          notes=$(cat <<EOF
          Built from \`${GITHUB_SHA:0:7}\` — $subject

          Linux:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.sh | sh
          \`\`\`

          macOS:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install-macos.sh | sh
          \`\`\`

          Windows downloader:

          https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/xd-nightly-windows-x86_64-setup.exe

          Or PowerShell:

          \`\`\`
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.ps1 | iex
          \`\`\`

          Or unpack it yourself:

          \`\`\`
          tar -xzf xd-nightly-linux-x86_64.tar.gz
          ./xd-nightly/xd.sh
          \`\`\`

          Android:

          Install \`xd-nightly-android.apk\` on a phone that can reach the
          machine running the daemon, then pair it from the desktop's Devices
          settings.
          It is a test build signed with a per-build key, so uninstall the
          previous one before installing a newer APK.

          Both desktop bundles are self-contained and install beside a release.
          EOF
          )

          # Replaced rather than edited: the tag has to move to this commit,
          # and a release whose tag points somewhere else is a lie about what
          # is in it.
          gh release delete nightly --cleanup-tag --yes || true

          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$notes" \
            xd-nightly-linux-x86_64.tar.gz \
            xd-nightly-linux-x86_64.tar.gz.sha256 \
            xd-nightly-macos-*.zip \
            xd-nightly-macos-*.zip.sha256 \
            xd-nightly-windows-x86_64.msi \
            xd-nightly-windows-x86_64.msi.sha256 \
            xd1.cab \
            xd1.cab.sha256 \
            xd-nightly-windows-x86_64-setup.exe \
            xd-nightly-windows-x86_64-setup.exe.sha256 \
            xd-nightly-android.apk \
            xd-nightly-android.apk.sha256 \
            scripts/install.sh \
            scripts/install-macos.sh \
            scripts/install.ps1
