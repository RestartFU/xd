# A runnable xd for every commit on master.
#
# The bundle is the same one scripts/build.sh produces locally: a binary with
# its whole library closure beside it, so it runs on any glibc x86_64 host
# without a GTK stack of its own. Published under a rolling "nightly" tag, so
# the download link never changes:
#
#   https://github.com/<owner>/<repo>/releases/download/nightly/xd-nightly-linux-x86_64.tar.gz
#   https://github.com/<owner>/<repo>/releases/download/nightly/xd-nightly-android.apk
#
# The installer is published beside it, from the same commit, so the script and
# the bundle it installs can never be from different builds. (Not /latest/: that
# resolves to the newest full release, and a nightly is a prerelease.)
#
# Built as the nightly profile, which gives it its own application id, settings,
# data directory and workspaces -- so installing it does not disturb a release
# on the same machine, and neither one edits the other's chats.
#
# The headless suite runs first and the release only happens if it passes: a
# nightly that does not work is worse than no nightly.

name: nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

# One at a time, newest wins. Two commits landing together would otherwise race
# to replace the same release, and the loser could be the newer one.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=nightly

      - name: Pack it
        run: |
          set -euo pipefail
          # Named so it unpacks into a directory rather than over the one it
          # was unpacked in, and named for the build so it cannot be mistaken
          # for a release.
          mv dist xd-nightly
          tar -czf xd-nightly-linux-x86_64.tar.gz xd-nightly
          sha256sum xd-nightly-linux-x86_64.tar.gz > xd-nightly-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            xd-nightly-linux-x86_64.tar.gz
            xd-nightly-linux-x86_64.tar.gz.sha256
            scripts/install.sh

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-cmark

      - name: Build and test the Windows client
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson setup build-windows \
            --prefix="$MINGW_PREFIX" \
            --buildtype=release \
            -Dprofile=nightly \
            -Dcommit="${GITHUB_SHA:0:7}"
          meson compile -C build-windows
          meson test -C build-windows --print-errorlogs
          DESTDIR="$PWD/stage-windows" \
            meson install -C build-windows --no-rebuild
          bash scripts/bundle-windows.sh \
            "$PWD/stage-windows" "$PWD/windows-dist"
          ./windows-dist/bin/xd.exe --version

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $payload = (Resolve-Path windows-dist).Path
          wix build installer/windows/xd.wxs `
            -arch x64 `
            -d "Payload=$payload" `
            -d "Version=0.1.0" `
            -d "ProductName=xd (Nightly)" `
            -d "InstallName=xd-nightly" `
            -d "UpgradeCode=5A04BCF5-0C4A-43DE-B8F4-B5D64E8E4F93" `
            -d "ShortcutGuid=E7E776D9-E605-4AE2-BAD8-6350E845A1DE" `
            -o xd-nightly-windows-x86_64.msi
          $hash = (Get-FileHash xd-nightly-windows-x86_64.msi -Algorithm SHA256).Hash.ToLower()
          "$hash  xd-nightly-windows-x86_64.msi" |
            Set-Content xd-nightly-windows-x86_64.msi.sha256

      - name: Test the PowerShell installer
        shell: pwsh
        run: |
          & ./scripts/install.ps1 `
            -MsiPath ./xd-nightly-windows-x86_64.msi `
            -ChecksumPath ./xd-nightly-windows-x86_64.msi.sha256 `
            -Quiet
          & "$env:ProgramFiles\RestartFU\xd-nightly\bin\xd.exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            xd-nightly-windows-x86_64.msi
            xd-nightly-windows-x86_64.msi.sha256
            scripts/install.ps1

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: >-
          brew install
          meson
          ninja
          pkgconf
          gtk4
          libadwaita
          json-glib
          sqlite
          vte3
          glib-networking
          librsvg
          cmark

      - name: Build and test the Apple Silicon app
        run: |
          set -euo pipefail
          meson setup build-macos \
            --prefix="$PWD/macos-prefix" \
            --buildtype=release \
            -Dprofile=nightly \
            -Dcommit="${GITHUB_SHA:0:7}"
          meson compile -C build-macos
          meson test -C build-macos --print-errorlogs
          meson install -C build-macos --no-rebuild
          ./scripts/bundle-macos.sh \
            "$PWD/macos-prefix" "$PWD" nightly
          ditto -c -k --sequesterRsrc --keepParent \
            xd-nightly.app xd-nightly-macos-arm64.zip
          shasum -a 256 xd-nightly-macos-arm64.zip \
            > xd-nightly-macos-arm64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            xd-nightly-macos-arm64.zip
            xd-nightly-macos-arm64.zip.sha256
            scripts/install-macos.sh

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Decode the Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/xd-nightly.p12"

      - name: Test and build the signed Android app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_NIGHTLY_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          docker buildx build \
            --target nightly-apk \
            --output type=local,dest=dist/mobile \
            --file mobile/Dockerfile \
            --build-arg ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER" \
            --secret id=android_keystore,src="$RUNNER_TEMP/xd-nightly.p12" \
            --secret id=android_keystore_password,env=ANDROID_KEYSTORE_PASSWORD \
            --secret id=android_key_alias,env=ANDROID_KEY_ALIAS \
            --secret id=android_key_password,env=ANDROID_KEY_PASSWORD \
            mobile

      - name: Checksum the APK
        run: |
          set -euo pipefail
          mv dist/mobile/xd-nightly-android.apk xd-nightly-android.apk
          sha256sum xd-nightly-android.apk > xd-nightly-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            xd-nightly-android.apk
            xd-nightly-android.apk.sha256

  publish:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          path: .
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          subject=$(git log -1 --format=%s)
          notes=$(cat <<EOF
          Built from \`${GITHUB_SHA:0:7}\` — $subject

          Install it:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.sh | sh
          \`\`\`

          Or unpack it yourself:

          \`\`\`
          tar -xzf xd-nightly-linux-x86_64.tar.gz
          ./xd-nightly/xd.sh
          \`\`\`

          Windows x86_64: download and run
          \`xd-nightly-windows-x86_64.msi\`, or run in PowerShell:

          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.ps1 | iex
          \`\`\`

          This first Windows build omits the embedded terminal and Windows
          daemon hosting.

          macOS 14+, Apple Silicon:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install-macos.sh | sh
          \`\`\`

          The macOS app is a separate native Mach-O build. It includes the
          embedded terminal; daemon hosting is not available there yet.

          Android 8.0+:

          Download \`xd-nightly-android.apk\` and install it after allowing
          APK installs from your browser or file manager. The Android app is a
          remote client; pair it with a reachable Linux daemon using
          \`xd serve --pair\`.

          All downloads are self-contained. Installs beside a release rather
          than over it -- its own settings, chats and workspaces. On Linux,
          the daemon is the same binary —
          \`./xd-nightly/bin/xd serve --pair\`.
          EOF
          )

          # Replaced rather than edited: the tag has to move to this commit,
          # and a release whose tag points somewhere else is a lie about what
          # is in it.
          gh release delete nightly --cleanup-tag --yes || true

          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$notes" \
            xd-nightly-linux-x86_64.tar.gz \
            xd-nightly-linux-x86_64.tar.gz.sha256 \
            xd-nightly-windows-x86_64.msi \
            xd-nightly-windows-x86_64.msi.sha256 \
            xd-nightly-macos-arm64.zip \
            xd-nightly-macos-arm64.zip.sha256 \
            xd-nightly-android.apk \
            xd-nightly-android.apk.sha256 \
            scripts/install.sh \
            scripts/install.ps1 \
            scripts/install-macos.sh
