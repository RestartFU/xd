# A release, cut from a tag.
#
# The same bundle the nightly publishes, built from the default profile -- so
# it installs as "xd", keeps its data in ~/.local/share/xd, and a nightly sitting
# beside it stays out of its way.
#
# Tag and push to cut one:
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a release from
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh

      - name: Pack it
        run: |
          set -euo pipefail
          mv dist xd
          tar -czf xd-linux-x86_64.tar.gz xd
          sha256sum xd-linux-x86_64.tar.gz > xd-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            xd-linux-x86_64.tar.gz
            xd-linux-x86_64.tar.gz.sha256
            scripts/install.sh

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-librsvg

      - name: Build and test the Windows client
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson setup build-windows \
            --prefix="$MINGW_PREFIX" \
            --buildtype=release \
            -Dcommit="${GITHUB_SHA:0:7}"
          meson compile -C build-windows
          meson test -C build-windows --print-errorlogs
          DESTDIR="$PWD/stage-windows" \
            meson install -C build-windows --no-rebuild
          bash scripts/bundle-windows.sh \
            "$PWD/stage-windows" "$PWD/windows-dist"
          ./windows-dist/bin/xd.exe --version

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $payload = (Resolve-Path windows-dist).Path
          wix build installer/windows/xd.wxs `
            -arch x64 `
            -d "Payload=$payload" `
            -d "Version=0.1.0" `
            -d "ProductName=xd" `
            -d "InstallName=xd" `
            -d "UpgradeCode=CDE5479B-9093-4E3C-8144-FCE8C86BEA18" `
            -d "ShortcutGuid=4E2C6D60-BBC8-4E6F-B230-C9824E0D1715" `
            -o xd-windows-x86_64.msi
          $hash = (Get-FileHash xd-windows-x86_64.msi -Algorithm SHA256).Hash.ToLower()
          "$hash  xd-windows-x86_64.msi" |
            Set-Content xd-windows-x86_64.msi.sha256

      - name: Test the PowerShell installer
        shell: pwsh
        run: |
          & ./scripts/install.ps1 `
            -Release `
            -MsiPath ./xd-windows-x86_64.msi `
            -ChecksumPath ./xd-windows-x86_64.msi.sha256 `
            -Quiet
          & "$env:ProgramFiles\RestartFU\xd\bin\xd.exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            xd-windows-x86_64.msi
            xd-windows-x86_64.msi.sha256
            scripts/install.ps1

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install native dependencies
        run: >-
          brew install
          meson
          ninja
          pkgconf
          gtk4
          libadwaita
          json-glib
          sqlite
          vte3
          glib-networking
          librsvg

      - name: Build and test the Apple Silicon app
        run: |
          set -euo pipefail
          meson setup build-macos \
            --prefix="$PWD/macos-prefix" \
            --buildtype=release \
            -Dcommit="${GITHUB_SHA:0:7}"
          meson compile -C build-macos
          meson test -C build-macos --print-errorlogs
          meson install -C build-macos --no-rebuild
          ./scripts/bundle-macos.sh \
            "$PWD/macos-prefix" "$PWD" release
          ditto -c -k --sequesterRsrc --keepParent \
            xd.app xd-macos-arm64.zip
          shasum -a 256 xd-macos-arm64.zip \
            > xd-macos-arm64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            xd-macos-arm64.zip
            xd-macos-arm64.zip.sha256
            scripts/install-macos.sh

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v5
        with:
          path: .
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ inputs.tag || github.ref_name }}"

          notes=$(cat <<EOF
          Install it:

          \`\`\`
          tar -xzf xd-linux-x86_64.tar.gz
          ./xd/xd.sh
          \`\`\`

          Windows x86_64: download and run \`xd-windows-x86_64.msi\`, or run:

          \`\`\`powershell
          & ([scriptblock]::Create((irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1))) -Release
          \`\`\`

          This first Windows build omits the embedded terminal and Windows
          daemon hosting.

          macOS 14+, Apple Silicon:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-macos.sh | sh -s -- --release
          \`\`\`

          The macOS app is a separate native Mach-O build. It includes the
          embedded terminal; daemon hosting is not available there yet.

          All downloads are self-contained. On Linux, the daemon is the same
          binary — \`./xd/bin/xd serve --pair\`.
          EOF
          )

          # A tag is published once. Re-running against one that already has a
          # release replaces its files rather than making a second release of
          # the same thing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              xd-linux-x86_64.tar.gz xd-linux-x86_64.tar.gz.sha256 \
              xd-windows-x86_64.msi xd-windows-x86_64.msi.sha256 \
              xd-macos-arm64.zip xd-macos-arm64.zip.sha256 \
              scripts/install.sh scripts/install.ps1 scripts/install-macos.sh
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "$notes" \
              xd-linux-x86_64.tar.gz \
              xd-linux-x86_64.tar.gz.sha256 \
              xd-windows-x86_64.msi \
              xd-windows-x86_64.msi.sha256 \
              xd-macos-arm64.zip \
              xd-macos-arm64.zip.sha256 \
              scripts/install.sh \
              scripts/install.ps1 \
              scripts/install-macos.sh
          fi
