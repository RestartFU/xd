# A release, cut by hand.
#
# The same bundle the nightly publishes, built from the default profile -- so
# it installs as "xd", keeps its data in ~/.local/share/xd, and a nightly
# sitting beside it stays out of its way.
#
# Run this workflow and choose what to release:
#
#   current   release the version the source already states
#   patch     0.0.1, for a fix
#   minor     0.1.0, for something new
#   major     1.0.0, for something that breaks
#
# A bump writes the new version into every file that states one, commits it,
# and tags it. Pushing a v* tag by hand still works and builds that tag as it
# stands.
#
# If a build fails after the tag is pushed, run it again with "current": a tag
# on this commit with no release behind it is picked up and finished rather
# than tagged twice.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Release the current version, or increment patch 0.0.1,
          minor 0.1.0, major 1.0.0
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major

# One release at a time, and never cancelled: a half-published release is
# worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # What is being released, decided once, before anything is built. On a bump
  # this is also what writes the version, commits it and tags it -- and pushes
  # both, because the build jobs check that tag out.
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
            && 'master' || github.ref }}

      - name: Work out the version and tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_version () {
            sed -nE \
              '0,/^[[:space:]]*version = "([0-9]+\.[0-9]+\.[0-9]+)"/{s//\1/p}' \
              desktop/Cargo.toml
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            current=$(source_version)
            recovery_tag="v$current"

            if [[ "$BUMP" == current ]]; then
              version="$current"
              tag="$recovery_tag"
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::Release $tag already exists."
                exit 1
              fi
              if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
                if ! git tag --points-at HEAD | grep -Fxq "$tag"; then
                  echo "::error::Tag $tag is on another commit."
                  exit 1
                fi
                echo "Finishing the unpublished $tag release."
              else
                git config user.name "github-actions[bot]"
                git config user.email \
                  "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -a "$tag" -m "xd $tag"
              fi
            elif git tag --points-at HEAD | grep -Fxq "$recovery_tag" \
              && ! gh release view "$recovery_tag" >/dev/null 2>&1; then
              # This commit is already tagged and was never published, so
              # bumping again would leave that tag behind unreleased.
              version="$current"
              tag="$recovery_tag"
              echo "Finishing the unpublished $tag release."
            else
              version=$(./scripts/bump-version.sh "$BUMP")
              tag="v$version"

              if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
                echo "::error::Tag $tag already exists."
                exit 1
              fi

              git config user.name "github-actions[bot]"
              git config user.email \
                "41898282+github-actions[bot]@users.noreply.github.com"
              git add \
                desktop/Cargo.toml \
                desktop/Cargo.lock \
                daemon-rs/Cargo.toml \
                daemon-rs/Cargo.lock \
                tls-proxy-rs/Cargo.toml
              git commit -m "chore: release $tag" \
                -m "Co-authored-by: Codex <codex@openai.com>"
              git tag -a "$tag" -m "xd $tag"
            fi
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"

            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A release tag has to look like v1.2.3."
              exit 1
            fi
            if [[ "$version" != "$(source_version)" ]]; then
              echo "::error::$tag does not match the source version $(source_version)."
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pushed before the builds because they check the tag out. A build that
      # fails leaves this tag unpublished, which is what "current" finishes.
      - name: Push the release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        # Atomic: master refusing a push must not leave the tag behind on its
        # own, pointing at a commit nothing else has.
        run: git push --atomic origin HEAD:master "$TAG"

  linux:
    needs: prepare
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh

      - name: Pack it
        run: |
          set -euo pipefail
          mv dist xd
          tar -czf xd-linux-x86_64.tar.gz xd
          sha256sum xd-linux-x86_64.tar.gz > xd-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            xd-linux-x86_64.tar.gz
            xd-linux-x86_64.tar.gz.sha256
            scripts/install.sh
            scripts/install-macos.sh

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Build and smoke-test the native app bundle
        env:
          PROFILE: release
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          brew install librsvg
          ./scripts/build-macos.sh
          ./scripts/smoke-macos.sh dist/macos/xd.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/macos/xd-macos-${{ matrix.arch }}.zip
            dist/macos/xd-macos-${{ matrix.arch }}.zip.sha256

  windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Build the self-contained native payload
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: >-
          ./scripts/build-windows.ps1
          -OutputDirectory windows-dist
          -Profile release

      - name: Build and exercise the MSI
        run: |
          ./scripts/package-windows.ps1 `
            -Payload windows-dist `
            -OutputDirectory artifacts `
            -Profile release `
            -Version '${{ needs.prepare.outputs.version }}'
          ./scripts/install.ps1 `
            -MsiPath artifacts/xd-windows-x86_64.msi `
            -ChecksumPath artifacts/xd-windows-x86_64.msi.sha256 `
            -Quiet

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/xd-windows-x86_64.msi
            artifacts/xd-windows-x86_64.msi.sha256
            scripts/install.ps1

  publish:
    needs: [prepare, linux, macos, windows]
    # GitHub's own runner: this job moves every artifact through itself, and
    # that gigabyte should not cross a home connection twice. See nightly.yml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v5
        with:
          path: .
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ needs.prepare.outputs.tag }}"

          notes=$(cat <<EOF
          Linux:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh -s -- --release
          \`\`\`

          macOS:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-macos.sh | sh -s -- --release
          \`\`\`

          Windows (PowerShell):

          \`\`\`
          & ([scriptblock]::Create((irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1))) -Release
          \`\`\`

          All desktop bundles are self-contained.
          EOF
          )

          # A tag is published once. Re-running against one that already has a
          # release replaces its files rather than making a second release of
          # the same thing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              xd-linux-x86_64.tar.gz xd-linux-x86_64.tar.gz.sha256 \
              xd-macos-*.zip xd-macos-*.zip.sha256 \
              xd-windows-x86_64.msi xd-windows-x86_64.msi.sha256 \
              scripts/install.sh scripts/install-macos.sh scripts/install.ps1
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes "$notes" \
              xd-linux-x86_64.tar.gz \
              xd-linux-x86_64.tar.gz.sha256 \
              xd-macos-*.zip \
              xd-macos-*.zip.sha256 \
              xd-windows-x86_64.msi \
              xd-windows-x86_64.msi.sha256 \
              scripts/install.sh \
              scripts/install-macos.sh \
              scripts/install.ps1
          fi
