# A runnable xd for every commit pushed to a pull request.
#
# The same bundle the nightly publishes, built as the dev profile: identical
# paths -- application id, settings, data directory, ~/.local/opt/xd-nightly --
# and one difference, which is that it updates from this rolling "dev" release
# instead of from "nightly". That is what makes a branch testable on a machine
# that already runs the nightly: install it once, and the update button and
# `xd serve --auto-update` follow the pull request from then on.
#
#   https://github.com/<owner>/<repo>/releases/download/dev/xd-nightly-linux-x86_64.tar.gz
#
# The commit it was built from is published beside it as commit.txt, which is
# what the update check reads: a dev build looks every twenty-five seconds from
# both the window and the daemon, and the GitHub API allows sixty unauthenticated
# requests an hour.
#
#   curl -fsSL https://github.com/<owner>/<repo>/releases/download/dev/install.sh | sh -s -- --dev
#
# Linux is the only thing published: it is what these builds are tried on. The
# Windows and macOS clients are still compiled and tested, because a branch that
# breaks them should say so before it is merged -- but the release does not wait
# for either of them, and neither one can hold up a Linux build that works.
#
# Built from the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: the rolling release is identified by the commit
# it was built from, and an update check compares that commit against the one
# the running build carries. A merge commit exists nowhere else, so a release
# tagged with one would never match anything.

name: dev

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
  workflow_dispatch:

# One at a time per pull request, newest wins: two pushes in a row would
# otherwise race to replace the same release, and the loser could be the newer.
concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=dev

      - name: Pack it
        run: |
          set -euo pipefail
          # Named exactly as the nightly's asset: a dev build unpacks to the
          # same directory and installs to the same paths, so the installer
          # needs no second name for it.
          mv dist xd-nightly
          tar -czf xd-nightly-linux-x86_64.tar.gz xd-nightly
          sha256sum xd-nightly-linux-x86_64.tar.gz > xd-nightly-linux-x86_64.tar.gz.sha256

          # The commit, on a line of its own, for the update check to read.
          # A dev build looks every twenty-five seconds from both the window and
          # the daemon, which is far past the sixty unauthenticated API requests
          # GitHub allows in an hour; a release asset is served past that limit.
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" \
            > commit.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          short=${HEAD_SHA:0:7}
          where=${PR_NUMBER:+PR #$PR_NUMBER}
          notes=$(cat <<EOF
          Built from \`$short\` — ${where:-${GITHUB_REF_NAME}}${PR_TITLE:+: $PR_TITLE}

          A nightly built from a branch. It installs to the nightly's own paths,
          over the nightly, and updates from this release from then on:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/install.sh | sh -s -- --dev
          \`\`\`

          Going back is the ordinary nightly line:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/install.sh | sh
          \`\`\`

          Linux x86_64 only; this is a build to try, not a release.
          EOF
          )

          # Replaced rather than edited: the tag has to move to this commit, and
          # a release whose tag points somewhere else is a lie about what is in
          # it. The commit it points at is what the update check compares.
          gh release delete dev --cleanup-tag --yes || true

          gh release create dev \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Dev $short" \
            --notes "$notes" \
            xd-nightly-linux-x86_64.tar.gz \
            xd-nightly-linux-x86_64.tar.gz.sha256 \
            commit.txt \
            scripts/install.sh

  # Compiled and tested, never published: the point is to hear about a branch
  # that breaks them, not to ship one.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-cmark

      - name: Build and test the Windows client
        shell: msys2 {0}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          meson setup build-windows \
            --prefix="$MINGW_PREFIX" \
            --buildtype=release \
            -Dprofile=dev \
            -Dcommit="${HEAD_SHA:0:7}"
          meson compile -C build-windows
          meson test -C build-windows --print-errorlogs
          ./build-windows/src/xd.exe --version

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install native dependencies
        run: >-
          brew install
          meson
          ninja
          pkgconf
          gtk4
          libadwaita
          json-glib
          sqlite
          vte3
          glib-networking
          librsvg
          cmark

      - name: Build and test the Apple Silicon app
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          meson setup build-macos \
            --prefix="$PWD/macos-prefix" \
            --buildtype=release \
            -Dprofile=dev \
            -Dcommit="${HEAD_SHA:0:7}"
          meson compile -C build-macos
          meson test -C build-macos --print-errorlogs
          ./build-macos/src/xd --version
