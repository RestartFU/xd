# Every commit pushed to a pull request, built and tested.
#
# Nothing is published. A branch is tried by building it: the nightly's own
# build button fetches it, builds the bundle the same way this does and
# installs the result over itself, so there is no rolling release to keep
# moving and no third kind of build that can break on its own.
#
# Built from the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: what is checked is the code that was pushed.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One at a time per pull request, newest wins: an older push is not worth a
# runner once a newer one exists.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=nightly

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-portaudio

      - name: Build the complete Windows payload
        shell: msys2 {0}
        run: ./scripts/build-windows.sh "$PWD/windows-dist" nightly

      - name: Build the MSI
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -Payload windows-dist
          -OutputDirectory windows-artifacts
          -Profile nightly
          -Version 0.1.0

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install native build dependencies
        run: >-
          brew install
          crystal
          pkgconf
          gtk4
          libadwaita
          vte3
          portaudio
          sqlite
          glib-networking
          librsvg
          cmake

      - name: Build the complete macOS app
        run: ./scripts/build-macos.sh "$PWD/macos-dist" nightly
