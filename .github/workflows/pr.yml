# Every commit pushed to a pull request, built and tested.
#
# Nothing is published. A branch is tried by building it: the nightly's own
# build button fetches it, builds the bundle the same way this does and
# installs the result over itself, so there is no rolling release to keep
# moving and no third kind of build that can break on its own.
#
# Built from the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: what is checked is the code that was pushed.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One at a time per pull request, newest wins: an older push is not worth a
# runner once a newer one exists.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    # The self-hosted runner for our own branches, GitHub's for a fork: this
    # repository is public, and a pull request runs whatever it contains. A
    # fork must not get that on the machine the runner lives on.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest'
      || fromJSON('["self-hosted", "linux", "x64", "xd"]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=nightly

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # The toolchain and GTK stack are a two-minute download every run
          # otherwise, and they only change when this list does.
          cache: true
          install: >-
            git
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-crystal
            mingw-w64-ucrt-x86_64-7zip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-portaudio

      # whisper.cpp is compiled from a pinned tag; see the macOS job.
      - uses: actions/cache@v4
        with:
          path: .payload-cache
          key: >-
            payloads-windows-x86_64-${{ hashFiles(
            'scripts/build-native-whisper.sh',
            'scripts/payload-cache.sh') }}
          restore-keys: payloads-windows-x86_64-

      - name: Build the complete Windows payload
        shell: msys2 {0}
        run: |
          # msys2 needs a Unix path; the workspace one is a drive path.
          XD_PAYLOAD_CACHE="$(cygpath -u "$GITHUB_WORKSPACE")/.payload-cache"
          export XD_PAYLOAD_CACHE
          ./scripts/build-windows.sh "$PWD/windows-dist" nightly

      - name: Build the MSI
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -Payload windows-dist
          -OutputDirectory windows-artifacts
          -Profile nightly
          -Version 0.1.0

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install native build dependencies
        env:
          # No `brew update` first: the formulae this needs are pinned by the
          # runner image and updating costs more than it can save here.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: >-
          brew install
          crystal
          pkgconf
          gobject-introspection
          gtk4
          libadwaita
          adwaita-icon-theme
          vte3
          portaudio
          sqlite
          glib-networking
          librsvg
          cmake

      # Git, OpenSSL and whisper.cpp are pinned by version and compiled the same
      # way every run, which is most of this job. Keyed on the scripts that
      # build them; each entry inside is keyed on its own version, so a partial
      # hit is still safe.
      - uses: actions/cache@v4
        with:
          path: .payload-cache
          key: >-
            payloads-macos-arm64-${{ hashFiles(
            'scripts/build-macos-git.sh',
            'scripts/build-macos-openssl.sh',
            'scripts/build-native-whisper.sh',
            'scripts/payload-cache.sh') }}
          restore-keys: payloads-macos-arm64-

      - name: Build the complete macOS app
        env:
          XD_PAYLOAD_CACHE: ${{ github.workspace }}/.payload-cache
        run: ./scripts/build-macos.sh "$PWD/macos-dist" nightly
