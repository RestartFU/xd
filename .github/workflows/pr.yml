# Every commit pushed to a pull request, tested and linted on each platform.
#
# Packaging only runs when the pull request touches something packaging reads,
# because tests catch nearly everything a package build would and the package
# is most of the wait. The nightly packages every platform after a merge, and
# dispatching this workflow on a branch packages it regardless.
#
# Nothing is published. A branch is tried by building it: the nightly's own
# build button fetches it, builds the bundle the same way a packaged run here
# does and installs the result over itself, so there is no rolling release to
# keep moving and no third kind of build that can break on its own.
#
# Built from the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: what is checked is the code that was pushed.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One at a time per pull request, newest wins: an older push is not worth a
# runner once a newer one exists.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.packaging.outputs.package }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Whole directories, so a new script or asset is covered without anyone
      # remembering this list. Anything but a clean "no difference" packages,
      # including a dispatch, which has no pull request to compare, and any
      # error from git: a needless package only costs minutes.
      - name: Detect packaging changes
        id: packaging
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          package=true
          if [ -n "$PR_BASE" ]; then
            status=0
            git diff --quiet "$PR_BASE...$PR_HEAD" -- \
              .dockerignore \
              .github/workflows \
              Dockerfile \
              data \
              desktop/assets \
              installer \
              scripts \
              '*/Cargo.lock' \
              '*/Cargo.toml' \
              || status=$?
            if [ "$status" -eq 0 ]; then
              package=false
            fi
          fi
          echo "package=$package" | tee -a "$GITHUB_OUTPUT"

  linux:
    needs: changes
    # GitHub's runner for every branch and fork: this repository is public,
    # and a pull request runs whatever it contains, so it never gets a
    # machine of ours.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # GitHub's runner starts with about 14 GB free; the Docker builds need
      # more, so drop the preinstalled toolchains nothing here uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      # Everything is built in Docker, so the runner needs nothing else.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        if: ${{ needs.changes.outputs.package == 'true' }}
        run: ./scripts/build.sh --build-arg PROFILE=nightly

      # Last, and despite a failure above, so one push reports tests and lints
      # together.
      - name: Lint the Rust crates
        if: ${{ !cancelled() }}
        run: ./scripts/clippy.sh

  windows:
    needs: changes
    uses: ./.github/workflows/windows.yml
    with:
      profile: nightly
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      skip_package: ${{ needs.changes.outputs.package != 'true' }}
      lint: true

  macos:
    needs: changes
    # Apple desktop code must be compiled on Apple hardware because GPUI links
    # native frameworks. This gate covers the Rust app and local helpers, plus
    # the complete ad-hoc-signed bundle when packaging inputs changed.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --component clippy
          --no-self-update

      - name: Limit build parallelism
        run: |
          jobs=$(./scripts/runner-jobs.sh --jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"

      # The dependency compile is most of this job, and a hosted runner keeps
      # nothing between runs. Keyed on the lockfiles, so unchanged dependencies
      # come back already built and cargo works out the rest.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
            host/target
            terminal-core/target
          key: >-
            cargo-${{ runner.os }}-arm64-1.95.0-${{
            hashFiles('desktop/Cargo.lock', 'host/Cargo.lock', 'terminal-core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-arm64-1.95.0-

      # Native packaging inputs are pinned by the scripts that put them here.
      - uses: actions/cache@v4
        if: ${{ needs.changes.outputs.package == 'true' }}
        with:
          path: .build-cache
          key: >-
            payload-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-macos.sh') }}
          restore-keys: payload-${{ runner.os }}-arm64-

      - name: Install native test dependencies
        run: brew install tmux

      - name: Test the native Rust targets
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          cargo fmt --check --manifest-path terminal-core/Cargo.toml
          cargo test --locked --manifest-path terminal-core/Cargo.toml
          cargo fmt --check --manifest-path desktop/Cargo.toml
          cargo test --locked --manifest-path desktop/Cargo.toml
          cargo fmt --check --manifest-path host/Cargo.toml
          cargo test --locked --manifest-path host/Cargo.toml

      - name: Build and smoke-test the native app bundle
        if: ${{ needs.changes.outputs.package == 'true' }}
        env:
          PROFILE: nightly
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          brew install librsvg
          ./scripts/build-macos.sh
          ./scripts/smoke-macos.sh dist/macos/xd-nightly.app

      # Last, and despite a failure above, so one push reports tests and lints
      # together.
      - name: Lint the native Rust targets
        if: ${{ !cancelled() }}
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          status=0
          for crate in terminal-core transport-core desktop host; do
            cargo clippy --locked --all-targets --manifest-path "$crate/Cargo.toml" -- -D warnings || status=1
          done
          exit "$status"
