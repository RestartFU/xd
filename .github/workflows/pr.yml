# Every commit pushed to a pull request, formatted and linted on each platform.
#
# This is deliberately all a pull request waits for, so merging stays quick.
# Clippy type-checks the code, and platform-specific code only on its own
# platform, but builds no binaries and runs no tests. The nightly tests and
# packages every platform after a merge, and a failure there is fixed on master.
#
# Nothing is published. A branch is tried by building it: the nightly's own
# build button fetches it, builds the bundle and installs the result over
# itself, so there is no rolling release to keep moving and no third kind of
# build that can break on its own.
#
# Checks the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: what is checked is the code that was pushed.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One at a time per pull request, newest wins: an older push is not worth a
# runner once a newer one exists.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    # GitHub's runner for every branch and fork: this repository is public,
    # and a pull request runs whatever it contains, so it never gets a
    # machine of ours.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test browser history gestures
        run: node --test desktop/tests/browser-history-gestures.cjs

      # Rust formatting and linting happen in Docker.
      - name: Check formatting and lint the Rust crates
        run: ./scripts/clippy.sh

  macos:
    # Apple desktop code must be checked on Apple hardware because GPUI links
    # native frameworks.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component clippy
          --no-self-update

      - name: Limit build parallelism
        run: |
          jobs=$(./scripts/runner-jobs.sh --jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"

      # Every crate even after a failure, so one push reports all of them.
      - name: Lint the native Rust targets
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          status=0
          for crate in terminal-core transport-core desktop host; do
            cargo clippy --locked --all-targets --manifest-path "$crate/Cargo.toml" -- -D warnings || status=1
          done
          exit "$status"

  windows:
    # The host is left out: on Windows it only ever runs inside WSL, so the
    # Linux job covers it.
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 3
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          --target x86_64-pc-windows-msvc --no-self-update

      # GPUI's build script compiles its shaders, even for a lint.
      - name: Locate the HLSL compiler
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem -Path "$sdkRoot/*/x64/fxc.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $fxc) { throw 'The Windows SDK HLSL compiler (fxc.exe) is required.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      # Every crate even after a failure, so one push reports all of them.
      - name: Lint the native Windows targets
        run: |
          $failed = $false
          foreach ($crate in 'terminal-core', 'transport-core', 'desktop') {
            cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc --manifest-path "$crate/Cargo.toml" -- -D warnings
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Windows lints failed.' }
