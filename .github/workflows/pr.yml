# Every commit pushed to a pull request, formatted and linted on each platform.
#
# This is deliberately all a pull request waits for, so merging stays quick.
# Clippy type-checks the code, and platform-specific code only on its own
# platform, but builds no binaries and runs no tests. The nightly tests and
# packages every platform after a merge, and a failure there is fixed on master.
#
# Nothing is published. A branch is tried by building it: the nightly's own
# build button fetches it, builds the bundle and installs the result over
# itself, so there is no rolling release to keep moving and no third kind of
# build that can break on its own.
#
# Checks the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: what is checked is the code that was pushed.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One at a time per pull request, newest wins: an older push is not worth a
# runner once a newer one exists.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: false
    # GitHub's runner for every branch and fork: this repository is public,
    # and a pull request runs whatever it contains, so it never gets a
    # machine of ours.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Everything happens in Docker, so the runner needs nothing else.
      - name: Check formatting and lint the Rust crates
        run: ./scripts/clippy.sh

  macos:
    # Apple desktop code must be checked on Apple hardware because GPUI links
    # native frameworks.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component clippy
          --no-self-update

      - name: Limit build parallelism
        run: |
          jobs=$(./scripts/runner-jobs.sh --jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"

      # Every crate even after a failure, so one push reports all of them.
      - name: Install native test dependencies
        run: brew install tmux

      - name: Repeat every host test
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          cd host
          cargo test --locked --no-run
          fails=0
          for i in $(seq 1 40); do
            if ! cargo test --locked --no-fail-fast > run.log 2>&1; then
              fails=$((fails+1))
              echo "=== failed run $i"
              grep -E "FAILED|panicked|disconnected|did not start|exit status|SUN_LEN" run.log | cut -c1-260 | head -30
            fi
          done
          grep -E "^test result" run.log | cut -c1-90
          echo "RESULT $fails failed of 40"
