# Every commit pushed to a pull request, built and tested.
#
# Nothing is published. A branch is tried by building it: the nightly's own
# build button fetches it, builds the bundle the same way this does and
# installs the result over itself, so there is no rolling release to keep
# moving and no third kind of build that can break on its own.
#
# Built from the pull request's head commit rather than the merge commit GitHub
# hands to `pull_request` runs: what is checked is the code that was pushed.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One at a time per pull request, newest wins: an older push is not worth a
# runner once a newer one exists.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    # The self-hosted runner for our own branches, GitHub's for a fork: this
    # repository is public, and a pull request runs whatever it contains. A
    # fork must not get that on the machine the runner lives on.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest'
      || fromJSON('["self-hosted", "linux", "x64", "xd"]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Everything is built in Docker, so the runner needs nothing else. Both
      # builds share layers, which is why the tests are cheap to gate on.
      - name: Run the headless tests
        run: ./scripts/test.sh

      - name: Build the bundle
        run: ./scripts/build.sh --build-arg PROFILE=nightly

  macos:
    # Apple desktop code must be compiled on Apple hardware because GPUI links
    # native frameworks. This gate covers the Rust app, local helpers, agent
    # binaries, and the complete ad-hoc-signed bundle.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Limit build parallelism
        run: |
          jobs=$(./scripts/runner-jobs.sh --jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"

      - name: Test the native Rust targets
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          cargo fmt --check --manifest-path desktop/Cargo.toml
          cargo test --locked --manifest-path desktop/Cargo.toml
          cargo fmt --check --manifest-path daemon-rs/Cargo.toml
          cargo test --locked --manifest-path daemon-rs/Cargo.toml
          cargo fmt --check --manifest-path tls-proxy-rs/Cargo.toml
          cargo test --manifest-path tls-proxy-rs/Cargo.toml

      - name: Build and smoke-test the native app bundle
        env:
          PROFILE: nightly
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          brew install librsvg
          ./scripts/build-macos.sh
          ./scripts/smoke-macos.sh dist/macos/xd-nightly.app

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Limit build parallelism
        shell: pwsh
        run: |
          $jobs = [Math]::Max(
            1,
            [Math]::Floor([Environment]::ProcessorCount * 0.75)
          )
          "CARGO_BUILD_JOBS=$jobs" >> $env:GITHUB_ENV
          "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> $env:GITHUB_ENV

      - name: Test the native Rust targets
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          cargo fmt --check --manifest-path desktop/Cargo.toml
          cargo test --locked --manifest-path desktop/Cargo.toml
          cargo build --locked --release --manifest-path desktop/Cargo.toml
          cargo fmt --check --manifest-path daemon-rs/Cargo.toml
          cargo test --locked --manifest-path daemon-rs/Cargo.toml
          cargo build --locked --release --manifest-path daemon-rs/Cargo.toml
          cargo fmt --check --manifest-path tls-proxy-rs/Cargo.toml
          cargo test --manifest-path tls-proxy-rs/Cargo.toml
          cargo build --release --manifest-path tls-proxy-rs/Cargo.toml
