# Rolling development build for the incremental Rust/GPUI desktop rewrite.
# This is intentionally separate from nightly: the Crystal client remains the
# production desktop until the GPUI client reaches feature parity.

name: gpui-dev

on:
  push:
    branches: [feat/gpui-desktop]
  workflow_dispatch:

concurrency:
  group: gpui-dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, xd]

    steps:
      - uses: actions/checkout@v5

      - name: Test and build the GPUI desktop
        run: >-
          docker buildx build
          --target gpui-desktop-check
          --output type=local,dest=gpui-dist
          .

      - name: Pack the prototype
        run: |
          set -euo pipefail
          test -f gpui-dist/gpui-tests-passed
          test -f gpui-dist/rust-daemon-tests-passed
          test -x gpui-dist/xd-desktop
          test -x gpui-dist/xd-daemon
          test -x gpui-dist/codex-package/bin/codex
          test -x gpui-dist/claude
          test -x gpui-dist/voice/libexec/whisper-server-bin

          install -d package/xd-dev
          install -m0755 gpui-dist/xd-desktop package/xd-dev/xd-dev
          install -m0755 gpui-dist/xd-daemon package/xd-dev/xd-daemon-dev
          cp -a gpui-dist/codex-package package/xd-dev/codex-package
          install -m0755 gpui-dist/claude package/xd-dev/claude
          cp -a gpui-dist/voice/lib package/xd-dev/lib
          cp -a gpui-dist/voice/libexec package/xd-dev/libexec
          install -m0644 desktop/README.md package/xd-dev/README.md

          tar -C package -czf xd-dev-linux-x86_64.tar.gz xd-dev
          sha256sum xd-dev-linux-x86_64.tar.gz \
            > xd-dev-linux-x86_64.tar.gz.sha256

      - name: Publish the rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          subject=$(git log -1 --format=%s)
          notes=$(cat <<EOF
          GPUI/Rust development build from \`${GITHUB_SHA:0:7}\` — $subject

          This is the in-progress GPUI desktop client, separate from production
          xd. It runs the bundled Rust daemon against isolated xd-dev state and
          uses bundled Codex, Claude Code, and whisper.cpp executables. No Crystal xd
          installation is required. The current Linux x86_64 build supports persisted workspaces,
          chats, drafts, queueing, options, shortcuts, and live assistant turns.

          Run it:

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/install-dev.sh | sh
          \`\`\`

          Or unpack it without installing:

          \`\`\`sh
          tar -xzf xd-dev-linux-x86_64.tar.gz
          ./xd-dev/xd-dev
          \`\`\`
          EOF
          )

          gh release delete dev --cleanup-tag --yes || true
          gh release create dev \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "GPUI Dev $(date -u +%Y-%m-%d)" \
            --notes "$notes" \
            xd-dev-linux-x86_64.tar.gz \
            xd-dev-linux-x86_64.tar.gz.sha256 \
            scripts/install-dev.sh
