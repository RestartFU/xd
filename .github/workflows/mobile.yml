name: mobile

on:
  pull_request:
    # Only what these jobs read: they build from mobile/ alone with these
    # scripts, so a change anywhere else cannot alter their result.
    paths:
      - 'mobile/**'
      - 'scripts/mobile-*.sh'
      - 'scripts/runner-docker-build.sh'
      - 'scripts/runner-jobs.sh'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    # GitHub's runner, for the reason given in pr.yml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # GitHub's runner starts with about 14 GB free; the Docker builds need
      # more, so drop the preinstalled toolchains nothing here uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      # The runner's own resolver has been seen failing every lookup of the
      # Ubuntu archive for an hour at a time while the rest of the internet
      # resolved. Written out here, not in a script, because a release builds
      # an older tag that would not have the script; keep the copies in
      # release, nightly, mobile and windows alike.
      - name: Resolve through public DNS
        run: |
          set -euo pipefail
          servers=(1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4)
          sudo rm -f /etc/resolv.conf
          printf 'nameserver %s\n' "${servers[@]}" | sudo tee /etc/resolv.conf >/dev/null
          dns=$(printf '%s\n' "${servers[@]}" | jq -R . | jq -sc .)
          config=$( (sudo cat /etc/docker/daemon.json 2>/dev/null || true) | jq -cn --argjson dns "$dns" '((try input catch null) // {}) | .dns = $dns')
          echo "$config" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info >/dev/null
          for host in archive.ubuntu.com security.ubuntu.com; do
            getent hosts "$host" || echo "::warning::$host does not resolve."
          done

      - name: Test shared code and build Android app
        run: >-
          ./scripts/runner-docker-build.sh
          --target verify
          --progress plain
          --file mobile/Dockerfile
          mobile

  ios:
    # Apple targets cannot be compiled on Linux, so the Docker job above never
    # builds iosMain. Without this job the iOS source set would rot silently.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Limit build parallelism
        run: |
          jobs=$(./scripts/runner-jobs.sh --jobs)
          echo "GRADLE_OPTS=-Dorg.gradle.workers.max=$jobs" >> "$GITHUB_ENV"

      - name: Compile iOS targets and run the shared suite on the simulator
        working-directory: mobile
        run: >-
          ./gradlew --no-daemon
          :shared:compileKotlinIosArm64
          :shared:iosSimulatorArm64Test
