name: mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/remote/**'
      - 'docs/protocol.md'
      - 'scripts/mobile-*.sh'
      - 'Makefile'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Test shared code and build Android app
        run: >-
          docker build
          --target verify
          --progress plain
          --file mobile/Dockerfile
          mobile
