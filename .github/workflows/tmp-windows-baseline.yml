# TEMPORARY: captures how the released Windows build behaves, for the pull
# request's before screenshots. Deleted before the pull request is ready.
name: tmp-windows-baseline

on:
  push:
    branches: [fix/windows-desktop-msi]
    paths:
      - .github/workflows/tmp-windows-baseline.yml
      - installer/windows/xd.wxs
      - scripts/build-windows.ps1

permissions:
  contents: read

jobs:
  # The installer alone, around a stand-in executable, to check its authoring
  # in a couple of minutes instead of after a full build.
  msi:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package and install both channels
        run: |
          $ErrorActionPreference = 'Stop'
          $stub = Join-Path $env:RUNNER_TEMP 'stub'
          New-Item -ItemType Directory -Path $stub | Out-Null
          Copy-Item C:\Windows\System32\whoami.exe (Join-Path $stub 'xd.exe')
          'host' | Set-Content (Join-Path $stub 'xd-host-linux')
          foreach ($profile in 'release', 'nightly') {
            ./scripts/build-windows.ps1 -Profile $profile -HostPayload (Join-Path $stub 'xd-host-linux') -Executable (Join-Path $stub 'xd.exe')
          }
          Get-ChildItem dist/windows | Select-Object Name, Length
          foreach ($name in 'xd', 'xd-nightly') {
            $msi = (Resolve-Path "dist/windows/$name-windows-x86_64.msi").Path
            $log = Join-Path $env:RUNNER_TEMP "$name-install.log"
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`""
            if ($process.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "install of $name failed: $($process.ExitCode)" }
          }
          Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Programs') | Select-Object FullName
          Get-ChildItem ([Environment]::GetFolderPath('Programs')) -Filter 'xd*' | Select-Object FullName
          Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object Publisher -eq 'RestartFU' | Format-List DisplayName, DisplayVersion, DisplayIcon, InstallLocation, UninstallString
          Get-ChildItem -Recurse 'HKCU:\Software\RestartFU' | Format-List
          foreach ($name in 'xd', 'xd-nightly') {
            $msi = (Resolve-Path "dist/windows/$name-windows-x86_64.msi").Path
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart'
            if ($process.ExitCode -ne 0) { throw "removal of $name failed: $($process.ExitCode)" }
          }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\xd')) { throw 'left the folder behind' }
          if (Test-Path 'HKCU:\Software\RestartFU') { throw 'left the registry key behind' }
          Write-Host 'installer authoring: ok'

  baseline:
    if: false
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download the released Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.17 --repo $env:GITHUB_REPOSITORY -p 'xd-windows-x86_64.zip' -D $env:RUNNER_TEMP
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'xd-windows-x86_64.zip') -DestinationPath (Join-Path $env:RUNNER_TEMP 'released')
          Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'released') | Select-Object FullName, Length

      - name: Prepare an isolated WSL distribution
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'xd-wsl-smoke'
          New-Item -ItemType Directory -Path $work | Out-Null
          $compressed = Join-Path $work 'rootfs.tar.gz'
          Invoke-WebRequest -Uri 'https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.6-x86_64.tar.gz' -OutFile $compressed
          $source = [IO.File]::OpenRead($compressed)
          $gzip = [IO.Compression.GZipStream]::new($source, [IO.Compression.CompressionMode]::Decompress)
          $tar = Join-Path $work 'rootfs.tar'
          $destination = [IO.File]::Create($tar)
          try { $gzip.CopyTo($destination) } finally {
            $destination.Dispose()
            $gzip.Dispose()
            $source.Dispose()
          }
          wsl.exe --import xd-ci-smoke (Join-Path $work 'distribution') $tar --version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot import the isolated WSL smoke distribution.' }
          wsl.exe --distribution xd-ci-smoke --exec sh -lc 'apk add --no-cache git tmux openssh-client ca-certificates'
          "XD_WSL_DISTRIBUTION=xd-ci-smoke" >> $env:GITHUB_ENV

      - name: Drive the released app's window
        run: |
          ./installer/windows/install-webview2.ps1
          ./scripts/test-windows-ui.ps1 -Executable (Join-Path $env:RUNNER_TEMP 'released/xd/xd.exe') -Output dist/windows-ui-before -Baseline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-before
          path: dist/windows-ui-before
          if-no-files-found: warn

      - name: Remove the isolated WSL test distribution
        if: always()
        run: wsl.exe --unregister xd-ci-smoke
