<?xml version="1.0" encoding="UTF-8"?>
<!--
  xd, in the app's own typeface (DM Sans Bold), drawn as outlines so the icon
  never depends on that font being installed wherever it is rendered.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
