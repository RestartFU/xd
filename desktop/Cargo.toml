[package]
name = "xd-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5"
base64 = "0.22"
cpal = "0.18.1"
gpui = "=0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"
xd-terminal = { path = "../terminal-core" }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[build-dependencies]
winresource = "0.1.30"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
