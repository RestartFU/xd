[package]
name = "xd-desktop"
version = "0.1.17"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5"
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
gpui = "=0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
portable-pty = "0.9.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"
url = "2.5"
wry = "0.57.0"
xd-terminal = { path = "../terminal-core" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"
x11rb = "0.13"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
