[package]
name = "xd-desktop"
version = "0.2.11"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5"
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
gpui = "=0.2.2"
iana-time-zone = "0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"
url = "2.5"
xd-terminal = { path = "../terminal-core" }
xd-transport = { path = "../transport-core" }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false }
# The Dockerfile pins the matching CEF distribution; keep the two in step.
cef = "=156.3.0"
x11rb = "0.13"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
raw-window-handle = "0.6.2"
wry = "0.57.0"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
