[package]
name = "xd-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5"
base64 = "0.22"
cpal = "0.18.1"
gpui = "=0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
