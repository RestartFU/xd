[package]
name = "xd-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "3.3"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
