[package]
name = "xd-host"
version = "0.1.13"
edition = "2024"
license = "MIT"
publish = false
autobins = false

[[bin]]
name = "xd-host"
path = "src/main.rs"

[lib]
name = "xd_host"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
thiserror = "2.0"
ureq = "3.3"
uuid = { version = "1.18", features = ["v4"] }
xd-terminal = { path = "../terminal-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
